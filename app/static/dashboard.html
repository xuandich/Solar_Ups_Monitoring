<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mạnh Quân Solar — Thiết bị</title>
<link rel="icon" href="/static/icon.jpg">
<style>
  :root {
    --bg: #0b1120;
    --card: #141b2d;
    --card-border: #232c42;
    --text: #e5e9f0;
    --text-dim: #8892a6;
    --blue: #3b82f6;
    --amber: #f59e0b;
    --green: #22c55e;
    --red: #ef4444;
    --cyan: #06b6d4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 16px;
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 1100px;
    margin: 0 auto 20px;
  }
  .topbar img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; }
  .topbar .titles { flex: 1; min-width: 0; }
  .topbar h1 { font-size: 16px; margin: 0; color: var(--text-dim); font-weight: 500; }
  .topbar .device-name { font-size: 20px; font-weight: 700; margin: 2px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a.back { color: var(--text-dim); text-decoration: none; font-size: 13px; }
  a.back:hover { color: var(--text); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; }
  .badge.online { background: rgba(34,197,94,.12); color: var(--green); }
  .badge.online .dot { background: var(--green); box-shadow: 0 0 0 0 rgba(34,197,94,.5); animation: pulse 2s infinite; }
  .badge.offline { background: rgba(239,68,68,.12); color: var(--red); }
  .badge.offline .dot { background: var(--red); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34,197,94,.5); }
    70% { box-shadow: 0 0 0 6px rgba(34,197,94,0); }
    100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
  }

  .wrap { max-width: 1100px; margin: 0 auto; }

  .hero {
    background: linear-gradient(135deg, #182238, #101729);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: center;
    justify-content: space-between;
  }
  .hero .power-value { font-size: 42px; font-weight: 800; line-height: 1; }
  .hero .power-label { color: var(--text-dim); font-size: 13px; margin-top: 6px; }
  .hero .status-line { color: var(--text-dim); font-size: 13px; margin-top: 8px; }
  .hero canvas { width: 260px; height: 70px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--accent, var(--blue));
  }
  .card .label { color: var(--text-dim); font-size: 12.5px; font-weight: 500; }
  .card .value { font-size: 26px; font-weight: 700; margin-top: 6px; }
  .card .unit { font-size: 14px; color: var(--text-dim); font-weight: 500; margin-left: 4px; }

  .card.clickable { cursor: pointer; transition: border-color .15s; }
  .card.clickable:hover { border-color: var(--accent, var(--blue)); }
  .card.clickable .hint { position: absolute; right: 12px; top: 12px; color: var(--text-dim); font-size: 11px; }
  .card.active { border-color: var(--accent, var(--blue)); }

  .chart-panel {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px 18px;
  }
  .chart-panel .chart-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
  }
  .chart-panel .chart-title { font-weight: 700; font-size: 15px; }
  .chart-panel .range-tabs { display: flex; gap: 6px; }
  .chart-panel .range-tabs button {
    background: var(--bg);
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  .chart-panel .range-tabs button.active { color: var(--bg); background: var(--green); border-color: var(--green); }
  .chart-panel .chart-scroll { overflow-x: auto; }
  .chart-panel canvas { height: 220px; display: block; }
  .chart-panel .chart-empty { color: var(--text-dim); font-size: 13px; text-align: center; padding: 40px 0; }
  .chart-panel .close-btn {
    background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px; line-height: 1;
    padding: 4px 8px;
  }
  .chart-panel .close-btn:hover { color: var(--text); }

  .footer { text-align: center; color: var(--text-dim); font-size: 12px; margin: 24px 0 8px; }
  .dim { opacity: .45; filter: grayscale(.3); transition: opacity .3s, filter .3s; }

  /* --- Sơ đồ UPS dùng đúng ảnh nền + overlay GIF gốc của ViewPower --- */
  .ups-diagram {
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px 16px;
    margin-bottom: 16px;
  }
  /* Toạ độ gốc (canvas 541x344px), quy đổi sang % để co giãn theo chiều
     rộng: input(0,139,251x17) output(290,139,251x17) bypass(150,18,241x17)
     upVline(130,36,17x100) bypassdownVline(394,37,17x100) downVline(262,158,17x100) */
  .ups-diagram-img { position: relative; width: 100%; max-width: 541px; aspect-ratio: 541 / 344; margin: 0 auto; }
  .ups-diagram-img img { position: absolute; display: none; }
  .ups-diagram-img img.bg { display: block; top: 0; left: 0; width: 100%; height: 100%; }
  .ups-diagram-img img.show { display: block; }
  .ups-diagram-img .ov-input { top: 40.41%; left: 0%; width: 46.39%; height: 4.94%; }
  .ups-diagram-img .ov-output { top: 40.41%; left: 53.60%; width: 46.39%; height: 4.94%; }
  .ups-diagram-img .ov-output-bypass { top: 40.41%; left: 76.52%; width: 23.48%; height: 4.94%; }
  .ups-diagram-img .ov-bypass { top: 5.23%; left: 27.73%; width: 44.55%; height: 4.94%; }
  .ups-diagram-img .ov-bypass-left { top: 10.47%; left: 24.03%; width: 3.14%; height: 29.07%; }
  .ups-diagram-img .ov-bypass-right { top: 10.76%; left: 72.83%; width: 3.14%; height: 29.07%; }
  .ups-diagram-img .ov-battery-charge, .ups-diagram-img .ov-battery-discharge {
    top: 45.93%; left: 48.43%; width: 3.14%; height: 29.07%;
  }

  /* Che chữ đen "Bypass/Input/Output/Battery" vốn nằm sẵn trong statusbg.png
     bằng nhãn màu xanh lá (toạ độ đo trực tiếp từ ảnh gốc bằng phân tích
     pixel, không phải áng chừng). */
  .ups-diagram-img .label-patch {
    position: absolute; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--green); font-weight: 700; font-size: 18px;
    white-space: nowrap; overflow: visible;
  }
  /* Input/Output circle kết thúc ở y=176px (51.16%), Battery circle kết
     thúc ở y=321px (93.3%) -> khung chữ phải bắt đầu SAU 2 mốc này để
     không đè lên icon. */
  .ups-diagram-img .lbl-bypass { top: 0%; left: 42%; width: 16%; height: 4.5%; }
  .ups-diagram-img .lbl-input { top: 51.3%; left: 7.5%; width: 11%; height: 6.5%; }
  .ups-diagram-img .lbl-output { top: 51.3%; left: 80.5%; width: 13%; height: 6.5%; }
  .ups-diagram-img .lbl-battery { top: 93.5%; left: 43%; width: 14%; height: 6.5%; }

  /* Bố cục 4 khung thông tin nằm CẠNH sơ đồ (không xếp bên dưới nữa), giống
     bố cục gốc ViewPower: UPS trên-phải, Input trái-giữa, Output phải-giữa,
     Battery dưới-giữa. Thu về 1 cột trên màn hình hẹp. */
  .ups-layout {
    display: grid;
    grid-template-columns: minmax(150px, 1fr) minmax(260px, 2fr) minmax(150px, 1fr);
    grid-template-areas:
      ".      diagram ups"
      "input  diagram output"
      ".      battery .";
    gap: 14px;
    align-items: center;
  }
  .ups-layout .area-diagram { grid-area: diagram; }
  .ups-layout .area-ups { grid-area: ups; }
  .ups-layout .area-input { grid-area: input; }
  .ups-layout .area-output { grid-area: output; }
  .ups-layout .area-battery { grid-area: battery; }
  @media (max-width: 720px) {
    .ups-layout {
      grid-template-columns: 1fr;
      grid-template-areas: "diagram" "ups" "input" "output" "battery";
    }
  }

  .info-panel {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .info-panel .info-title {
    font-weight: 700;
    font-size: 12px;
    text-align: center;
    padding-bottom: 8px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--card-border);
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 5px 0;
  }
  .info-row .info-label { color: var(--text-dim); font-size: 12.5px; }
  .info-row .info-value { font-weight: 700; font-size: 14px; white-space: nowrap; }
  .info-row .info-value .unit { color: var(--text-dim); font-weight: 500; font-size: 12px; margin-left: 3px; }
  .info-row.clickable { cursor: pointer; border-radius: 8px; margin: 0 -6px; padding: 5px 6px; transition: background .15s; }
  .info-row.clickable:hover, .info-row.clickable.active { background: rgba(245,158,11,.1); }

  .empty {
    max-width: 1100px;
    margin: 60px auto;
    text-align: center;
    color: var(--text-dim);
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="titles">
      <h1><a class="back" href="/">← danh sách thiết bị</a></h1>
      <div class="device-name" id="deviceTitle">Đang tải…</div>
    </div>
    <span class="badge offline" id="statusBadge"><span class="dot"></span><span id="statusText">Đang kết nối…</span></span>
  </div>

  <div class="wrap" id="content" style="display:none">
    <div class="hero">
      <div>
        <div class="power-value"><span id="heroValue">--</span><span class="unit" id="heroUnit"></span></div>
        <div class="power-label" id="heroLabel">Công suất</div>
        <div class="status-line" id="lastUpdate"></div>
      </div>
      <canvas id="sparkline" width="520" height="140"></canvas>
    </div>

    <div class="grid" id="cardsGrid"></div>

    <div class="chart-panel" id="chartPanel" style="display:none; margin-top:12px">
      <div class="chart-head">
        <div class="chart-title" id="chartTitle">--</div>
        <div class="range-tabs" id="rangeTabs">
          <button data-range="12h">12 giờ</button>
          <button data-range="day">Ngày</button>
          <button data-range="month">Tháng</button>
        </div>
        <button class="close-btn" id="chartClose" title="Đóng">✕</button>
      </div>
      <div class="chart-scroll" id="chartScroll">
        <canvas id="chartCanvas" width="900" height="220"></canvas>
      </div>
      <div class="chart-empty" id="chartEmpty" style="display:none">Chưa đủ dữ liệu lịch sử cho khoảng thời gian này.</div>
    </div>

    <div class="footer">Cập nhật mỗi 2 giây · dữ liệu lấy trực tiếp từ mạng nội bộ, không qua Cloud</div>
  </div>

  <div class="empty" id="emptyState" style="display:none">
    <p style="font-size:16px">Chưa nhận được dữ liệu từ thiết bị này.</p>
    <p style="font-size:13px">Kiểm tra lại kết nối mạng, hoặc chạy <code>./scan.sh</code> để dò lại thiết bị.</p>
  </div>

<script>
const deviceId = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop());
document.getElementById("deviceTitle").textContent = deviceId;

const FIELD_DEFS = {
  charger: [
    { key: "pvVoltage", label: "PV Voltage", unit: "V", accent: "var(--blue)", decimals: 1 },
    { key: "pvCurrent", label: "PV Current", unit: "A", accent: "var(--amber)", decimals: 2 },
    { key: "batVoltage", label: "Battery Voltage", unit: "V", accent: "var(--blue)", decimals: 1 },
    { key: "batCurrent", label: "Battery Current", unit: "A", accent: "var(--amber)", decimals: 2 },
    { key: "powerToday", label: "Energy Today", unit: "kWh", accent: "var(--green)", decimals: 2 },
    { key: "powerTotal", label: "Energy Total", unit: "kWh", accent: "var(--green)", decimals: 2 },
    { key: "temperature", label: "Temperature", unit: "°C", accent: "var(--red)", decimals: 1 },
  ],
  inverter: [
    { key: "dcVoltage", label: "DC Voltage", unit: "V", accent: "var(--blue)", decimals: 1 },
    { key: "acVoltage", label: "AC Voltage", unit: "V", accent: "var(--blue)", decimals: 1 },
    { key: "limiterPower", label: "Grid Power", unit: "W", accent: "var(--amber)", decimals: 0 },
    { key: "limiterToday", label: "Grid Today", unit: "kWh", accent: "var(--cyan)", decimals: 2 },
    { key: "limiterTotal", label: "Grid Total", unit: "kWh", accent: "var(--cyan)", decimals: 2 },
    { key: "energyToday", label: "Energy Today", unit: "kWh", accent: "var(--green)", decimals: 2 },
    { key: "energyTotal", label: "Energy Total", unit: "kWh", accent: "var(--green)", decimals: 2 },
    { key: "temperature", label: "Temperature", unit: "°C", accent: "var(--red)", decimals: 1 },
  ],
  ups: [
    // Chỉ Load được lưu lịch sử + xem biểu đồ (xem app/poller.py _run_nut).
    // Các mục dưới chỉ hiển thị giá trị live, không có dữ liệu lịch sử.
    { key: "load", label: "Load", unit: "%", accent: "var(--amber)", decimals: 0 },
    { key: "batteryCharge", label: "Battery Charge", unit: "%", accent: "var(--green)", decimals: 0, chartable: false },
    { key: "batteryRuntimeMin", label: "Battery Runtime", unit: "phút", accent: "var(--green)", decimals: 0, chartable: false },
    { key: "batteryVoltage", label: "Battery Voltage", unit: "V", accent: "var(--blue)", decimals: 1, chartable: false },
    { key: "inputVoltage", label: "Input Voltage", unit: "V", accent: "var(--blue)", decimals: 1, chartable: false },
    { key: "outputVoltage", label: "Output Voltage", unit: "V", accent: "var(--blue)", decimals: 1, chartable: false },
    { key: "temperature", label: "Temperature", unit: "°C", accent: "var(--red)", decimals: 1, chartable: false },
  ],
};
const HERO_KEY = { charger: "chargingPower", inverter: "outputPower", ups: "load" };
const HERO_UNIT = { charger: "W", inverter: "W", ups: "%" };
const HERO_LABEL = { charger: "Công suất sạc", inverter: "Công suất hòa lưới", ups: "Tải UPS" };

let lastSuccessAt = 0;
let history = []; // {ts, value}
let currentKind = null;
const POLL_MS = 2000;
const STALE_MS = POLL_MS * 3;

const ACCENT_HEX = {
  "var(--blue)": "#3b82f6",
  "var(--amber)": "#f59e0b",
  "var(--green)": "#22c55e",
  "var(--red)": "#ef4444",
  "var(--cyan)": "#06b6d4",
};

function fmt(v, decimals) {
  if (v === null || v === undefined || Number.isNaN(v)) return "--";
  return Number(v).toFixed(decimals);
}

function relTime(ts) {
  if (!ts) return "";
  const secs = Math.round((Date.now() - ts) / 1000);
  if (secs < 2) return "vừa cập nhật";
  return `cập nhật ${secs} giây trước`;
}

// Diễn giải statusText thô từ thiết bị sang nhãn dễ hiểu hơn. Chỉ suy diễn
// khi có dữ liệu thực tế xác nhận (vd: PV thấp hơn Battery -> chắc chắn
// không thể sạc), tránh gán cứng 1 lời giải thích có thể sai cho mọi
// trường hợp UNKNOWN.
function friendlyStatus(kind, raw, payload) {
  if (kind === "charger" && raw === "UNKNOWN") {
    const pv = payload.pvVoltage, bat = payload.batVoltage;
    if (pv !== undefined && bat !== undefined && pv < bat && (payload.chargingPower || 0) < 1) {
      return "Dừng sạc (áp PV thấp)";
    }
    return "Không xác định";
  }
  if (kind === "ups") return friendlyUpsStatus(raw);
  if (raw === "Charging") return "Đang sạc";
  if (raw === "Idle") return "Chờ";
  return raw;
}

// ViewPower trả workMode dạng chữ sẵn (vd: "ECO mode"), chỉ cần hiện nguyên văn.
function friendlyUpsStatus(raw) {
  if (!raw) return "Không rõ";
  return raw;
}

function renderUpsDiagram(payload) {
  const grid = document.getElementById("cardsGrid");
  const bypass = !!payload.bypassActive;
  const onBattery = !!payload.onBattery;
  const loadDef = FIELD_DEFS.ups[0]; // { key: "load", ... }
  const loadActive = loadDef.key === activeMetricKey;

  grid.innerHTML = `
    <div class="ups-diagram">
      <div class="ups-diagram-img">
        <img class="bg" src="/static/ups/statusbg.png">
        <!-- Bộ sạc (Rectifier) chạy độc lập với đường Bypass: hễ có điện lưới
             (không xả ắc quy) là còn sạc AC -> Battery, kể cả khi bypass đang
             bật (bypass chỉ thay đường ra Output, không tắt bộ sạc). -->
        <img class="ov-input ${!onBattery ? "show" : ""}" src="/static/ups/input.gif">
        <!-- Đường ra Output: bypass bật -> đi thẳng (đoạn ngắn outputbypass,
             không qua Inverter); bypass tắt -> qua Inverter (đoạn đầy đủ). -->
        <img class="ov-output ${!bypass ? "show" : ""}" src="/static/ups/output.gif">
        <img class="ov-output-bypass ${bypass ? "show" : ""}" src="/static/ups/outputbypass.gif">
        <img class="ov-bypass ${bypass ? "show" : ""}" src="/static/ups/bypass.gif">
        <img class="ov-bypass-left ${bypass ? "show" : ""}" src="/static/ups/upVline.gif">
        <img class="ov-bypass-right ${bypass ? "show" : ""}" src="/static/ups/bypassdownVline.gif">
        <!-- Có input (không xả ắc quy) -> luôn có nhánh sạc ắc quy (chiều xuống);
             đang xả (mất điện lưới) -> đổi sang chiều lên (upVline.gif dùng lại). -->
        <img class="ov-battery-charge ${!onBattery ? "show" : ""}" src="/static/ups/downVline.gif">
        <img class="ov-battery-discharge ${onBattery ? "show" : ""}" src="/static/ups/upVline.gif">
        <div class="label-patch lbl-bypass">Bypass</div>
        <div class="label-patch lbl-input">Input</div>
        <div class="label-patch lbl-output">Output</div>
        <div class="label-patch lbl-battery">Battery</div>
      </div>
    </div>

    <div class="ups-info-grid">
      <div class="info-panel">
        <div class="info-title">UPS information</div>
        <div class="info-row"><span class="info-label">UPS mode</span><span class="info-value">${payload.workMode || "--"}</span></div>
        <div class="info-row"><span class="info-label">UPS temp.</span><span class="info-value">${fmt(payload.temperature, 1)}<span class="unit">°C</span></span></div>
      </div>
      <div class="info-panel">
        <div class="info-title">Input information</div>
        <div class="info-row"><span class="info-label">Input voltage</span><span class="info-value">${fmt(payload.inputVoltage, 1)}<span class="unit">V</span></span></div>
        <div class="info-row"><span class="info-label">Input frequency</span><span class="info-value">${fmt(payload.inputFrequency, 1)}<span class="unit">Hz</span></span></div>
      </div>
      <div class="info-panel">
        <div class="info-title">Output information</div>
        <div class="info-row"><span class="info-label">Output voltage</span><span class="info-value">${fmt(payload.outputVoltage, 1)}<span class="unit">V</span></span></div>
        <div class="info-row"><span class="info-label">Output frequency</span><span class="info-value">${fmt(payload.outputFrequency, 1)}<span class="unit">Hz</span></span></div>
        <div class="info-row clickable ${loadActive ? "active" : ""}" data-key="${loadDef.key}" data-label="${loadDef.label}" data-unit="${loadDef.unit}" data-accent="${loadDef.accent}" data-decimals="${loadDef.decimals}">
          <span class="info-label">Load level 📊</span><span class="info-value">${fmt(payload.load, 0)}<span class="unit">%</span></span>
        </div>
        <div class="info-row"><span class="info-label">Current</span><span class="info-value">${fmt(payload.outputCurrent, 1)}<span class="unit">A</span></span></div>
      </div>
      <div class="info-panel">
        <div class="info-title">Battery information</div>
        <div class="info-row"><span class="info-label">Battery voltage</span><span class="info-value">${fmt(payload.batteryVoltage, 1)}<span class="unit">V</span></span></div>
        <div class="info-row"><span class="info-label">Battery capacity</span><span class="info-value">${fmt(payload.batteryCharge, 0)}<span class="unit">%</span></span></div>
        <div class="info-row"><span class="info-label">Remaining backup time</span><span class="info-value">${fmt(payload.batteryRuntimeMin, 0)}<span class="unit">Min</span></span></div>
      </div>
    </div>
  `;
}

function renderCards(kind, dataObj) {
  if (kind === "ups") {
    renderUpsDiagram(dataObj);
    return;
  }
  const defs = FIELD_DEFS[kind] || [];
  const grid = document.getElementById("cardsGrid");
  grid.innerHTML = defs.map(d => {
    const chartable = d.chartable !== false;
    const cls = chartable ? `clickable ${d.key === activeMetricKey ? "active" : ""}` : "";
    const dataAttrs = chartable
      ? `data-key="${d.key}" data-label="${d.label}" data-unit="${d.unit}" data-accent="${d.accent}" data-decimals="${d.decimals}"`
      : "";
    return `
    <div class="card ${cls}" style="--accent:${d.accent}" ${dataAttrs}>
      ${chartable ? '<div class="hint">📊</div>' : ""}
      <div class="label">${d.label}</div>
      <div class="value">${fmt(dataObj ? dataObj[d.key] : null, d.decimals)}<span class="unit">${d.unit}</span></div>
    </div>
  `;
  }).join("");
}

// --- Biểu đồ lịch sử theo giờ/ngày/tháng khi bấm vào 1 thẻ số liệu ---
let activeMetricKey = null;
let activeMetricColor = "#22c55e";
let activeMetricUnit = "";
let activeMetricDecimals = 1;
let activeRange = "12h";

function labelForRange(ts, range) {
  const d = new Date(ts * 1000);
  if (range === "month") return `${d.getDate()}/${d.getMonth() + 1}`;
  return `${String(d.getHours()).padStart(2, "0")}h`;
}

const BAR_WIDTH = 22;
const BAR_GAP = 10;

function niceAxisMax(value) {
  if (value <= 0) return 1;
  const exp = Math.floor(Math.log10(value));
  const base = Math.pow(10, exp);
  const frac = value / base;
  const niceFrac = frac <= 1 ? 1 : frac <= 2 ? 2 : frac <= 5 ? 5 : 10;
  return niceFrac * base;
}

function drawBarChart(canvas, points, color, unit, decimals) {
  const container = document.getElementById("chartScroll");
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const cssHeight = 220;
  // padLeft chừa chỗ cho thanh đơn vị (trục Y) bên trái.
  const padLeft = 46, padRight = 12, padTop = 10, padBottom = 26;

  // Độ rộng cột CỐ ĐỊNH (không dãn theo số điểm dữ liệu). Nếu tổng bề rộng
  // các cột nhỏ hơn khung nhìn thì căn giữa; nếu lớn hơn thì canvas rộng ra
  // và khung ngoài (chart-scroll) cuộn ngang được, không co bóp cột lại.
  const slot = BAR_WIDTH + BAR_GAP;
  const contentWidth = points.length * slot;
  const visibleWidth = container.clientWidth || 900;
  const cssWidth = Math.max(visibleWidth, padLeft + padRight + contentWidth);

  canvas.style.width = cssWidth + "px";
  canvas.width = cssWidth * dpr;
  canvas.height = cssHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssWidth, cssHeight);
  if (!points.length) return;

  const rawMax = Math.max(...points.map(p => p.value || 0), 0.0001);
  const axisMax = niceAxisMax(rawMax);
  const chartH = cssHeight - padTop - padBottom;
  const startX = padLeft + Math.max(0, (cssWidth - padLeft - padRight - contentWidth) / 2);
  const labelEvery = Math.max(1, Math.ceil(points.length / 12));

  // Thanh đơn vị bên trái: gridline ngang + giá trị kèm đơn vị tại mỗi mốc.
  const TICKS = 4;
  ctx.textAlign = "right";
  ctx.font = "10px -apple-system, sans-serif";
  for (let t = 0; t <= TICKS; t++) {
    const val = (axisMax / TICKS) * t;
    const y = padTop + chartH - (t / TICKS) * chartH;

    ctx.strokeStyle = "rgba(136,146,166,.15)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padLeft, y);
    ctx.lineTo(cssWidth - padRight, y);
    ctx.stroke();

    ctx.fillStyle = "#8892a6";
    ctx.fillText(`${fmt(val, decimals)} ${unit}`, padLeft - 8, y + 3);
  }

  points.forEach((p, i) => {
    const val = p.value || 0;
    const h = (val / axisMax) * chartH;
    const x = startX + i * slot;
    const y = padTop + chartH - h;

    ctx.fillStyle = color;
    ctx.globalAlpha = val > 0 ? 0.9 : 0.15;
    const r = Math.min(3, BAR_WIDTH / 2);
    ctx.beginPath();
    ctx.moveTo(x, y + r);
    ctx.arcTo(x, y, x + r, y, r);
    ctx.lineTo(x + BAR_WIDTH - r, y);
    ctx.arcTo(x + BAR_WIDTH, y, x + BAR_WIDTH, y + r, r);
    ctx.lineTo(x + BAR_WIDTH, padTop + chartH);
    ctx.lineTo(x, padTop + chartH);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;

    if (i % labelEvery === 0) {
      ctx.fillStyle = "#8892a6";
      ctx.font = "10px -apple-system, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(p.label, x + BAR_WIDTH / 2, cssHeight - 8);
    }
  });

  // Cuộn tới cột mới nhất (bên phải) khi dữ liệu tràn khung nhìn.
  if (contentWidth + padLeft + padRight > visibleWidth) {
    container.scrollLeft = container.scrollWidth;
  }
}

async function loadChart() {
  if (!activeMetricKey || !currentKind) return;
  const canvas = document.getElementById("chartCanvas");
  const emptyEl = document.getElementById("chartEmpty");
  try {
    const res = await fetch(`/api/chart/${encodeURIComponent(deviceId)}?range=${activeRange}`);
    const rows = await res.json();
    const points = rows
      .map(r => ({
        ts: r.ts,
        value: r.data && r.data[currentKind] ? r.data[currentKind][activeMetricKey] : null,
        label: labelForRange(r.ts, activeRange),
      }))
      .filter(p => p.value !== null && p.value !== undefined && !Number.isNaN(p.value));

    if (points.length < 2) {
      canvas.style.display = "none";
      emptyEl.style.display = "block";
      return;
    }
    canvas.style.display = "block";
    emptyEl.style.display = "none";
    drawBarChart(canvas, points, activeMetricColor, activeMetricUnit, activeMetricDecimals);
  } catch (e) {
    canvas.style.display = "none";
    emptyEl.style.display = "block";
  }
}

function updateRangeTabsUI() {
  document.querySelectorAll("#rangeTabs button").forEach(b => {
    b.classList.toggle("active", b.dataset.range === activeRange);
  });
}

function openChartPanel(key, label, unit, accent, decimals) {
  activeMetricKey = key;
  activeMetricColor = ACCENT_HEX[accent] || "#22c55e";
  activeMetricUnit = unit;
  activeMetricDecimals = Number(decimals) || 0;
  document.getElementById("chartPanel").style.display = "block";
  document.getElementById("chartTitle").textContent = `${label} (${unit}) — lịch sử`;
  updateRangeTabsUI();
  document.querySelectorAll("#cardsGrid .clickable[data-key]").forEach(c => c.classList.toggle("active", c.dataset.key === key));
  loadChart();
}

function closeChartPanel() {
  activeMetricKey = null;
  document.getElementById("chartPanel").style.display = "none";
  document.querySelectorAll("#cardsGrid .clickable[data-key]").forEach(c => c.classList.remove("active"));
}

document.getElementById("cardsGrid").addEventListener("click", (e) => {
  const card = e.target.closest(".clickable[data-key]");
  if (!card) return;
  const key = card.dataset.key;
  if (activeMetricKey === key) {
    closeChartPanel();
  } else {
    openChartPanel(key, card.dataset.label, card.dataset.unit, card.dataset.accent, card.dataset.decimals);
  }
});

document.getElementById("chartClose").addEventListener("click", closeChartPanel);

document.getElementById("rangeTabs").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-range]");
  if (!btn) return;
  activeRange = btn.dataset.range;
  updateRangeTabsUI();
  loadChart();
});

setInterval(() => { if (activeMetricKey) loadChart(); }, 30000);

function drawSparkline() {
  const canvas = document.getElementById("sparkline");
  const ctx = canvas.getContext("2d");
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (history.length < 2) return;

  const values = history.map(p => p.value).filter(v => v !== null && v !== undefined);
  if (values.length < 2) return;
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;

  ctx.beginPath();
  history.forEach((p, i) => {
    const x = (i / (history.length - 1)) * (w - 8) + 4;
    const val = p.value ?? min;
    const y = h - 8 - ((val - min) / range) * (h - 16);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = "#22c55e";
  ctx.lineWidth = 2;
  ctx.stroke();

  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, "rgba(34,197,94,.25)");
  grad.addColorStop(1, "rgba(34,197,94,0)");
  ctx.lineTo(w - 4, h);
  ctx.lineTo(4, h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
}

function setOnline(isOnline) {
  const badge = document.getElementById("statusBadge");
  const content = document.getElementById("content");
  badge.className = "badge " + (isOnline ? "online" : "offline");
  content.classList.toggle("dim", !isOnline);
}

async function loadHistory(kind) {
  try {
    const res = await fetch(`/api/history/${encodeURIComponent(deviceId)}?limit=30`);
    if (!res.ok) return;
    const rows = await res.json();
    const key = HERO_KEY[kind];
    history = rows.reverse().map(r => ({ ts: r.ts * 1000, value: r.data?.[kind]?.[key] }));
    drawSparkline();
  } catch (e) { /* ignore */ }
}

let loadedHistoryFor = null;
let everHadData = false;

async function tick() {
  let data = null;
  try {
    const res = await fetch(`/api/status/${encodeURIComponent(deviceId)}`);
    if (res.ok) data = await res.json();
  } catch (e) { /* network error, treat as offline */ }

  if (!data) {
    setOnline(false);
    document.getElementById("statusText").textContent = "Mất kết nối";
    if (!everHadData) {
      document.getElementById("emptyState").style.display = "block";
    }
    return;
  }

  everHadData = true;
  document.getElementById("content").style.display = "block";
  document.getElementById("emptyState").style.display = "none";
  lastSuccessAt = Date.now();
  const hasData = data.hasData;

  const kind = data.charger ? "charger" : (data.inverter ? "inverter" : (data.ups ? "ups" : null));
  if (!kind) {
    setOnline(false);
    document.getElementById("statusText").textContent = "Không rõ loại thiết bị";
    return;
  }
  currentKind = kind;

  if (loadedHistoryFor !== deviceId) {
    loadedHistoryFor = deviceId;
    await loadHistory(kind);
  }

  const payload = data[kind];
  const rawStatus = payload.statusText || (hasData ? "Online" : "Offline");
  const statusText = friendlyStatus(kind, rawStatus, payload);
  setOnline(hasData);
  document.getElementById("statusText").textContent = hasData ? statusText : "Mất kết nối";

  renderCards(kind, payload);

  const heroKey = HERO_KEY[kind];
  document.getElementById("heroValue").textContent = fmt(payload[heroKey], 0);
  let heroUnitText = " " + HERO_UNIT[kind];
  if (kind === "ups" && payload.loadWatts !== null && payload.loadWatts !== undefined) {
    heroUnitText += ` (${fmt(payload.loadWatts, 0)} W)`;
  }
  document.getElementById("heroUnit").textContent = heroUnitText;
  document.getElementById("heroLabel").textContent = HERO_LABEL[kind];
  document.getElementById("lastUpdate").textContent = relTime(lastSuccessAt);

  history.push({ ts: Date.now(), value: payload[heroKey] });
  if (history.length > 30) history.shift();
  drawSparkline();
}

setInterval(() => {
  document.getElementById("lastUpdate").textContent = relTime(lastSuccessAt);
  if (lastSuccessAt && Date.now() - lastSuccessAt > STALE_MS) {
    setOnline(false);
    document.getElementById("statusText").textContent = "Mất kết nối";
  }
}, 1000);

tick();
setInterval(tick, POLL_MS);
</script>
