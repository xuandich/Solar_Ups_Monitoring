<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar System</title>
<link rel="icon" href="/static/icon.jpg">
<style>
  :root {
    --bg: #0b1120;
    --card: #141b2d;
    --card-border: #232c42;
    --text: #e5e9f0;
    --text-dim: #8892a6;
    --blue: #3b82f6;
    --amber: #f59e0b;
    --green: #22c55e;
    --red: #ef4444;
    --cyan: #06b6d4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 16px;
  }
  /* +204px (190px cột KPI + 14px gap) để ô UPS vẫn giữ nguyên bề rộng ~1100px
     như lúc cột KPI còn nằm ngang phía trên, thay vì bị cột KPI lấn vào.
     +76px (~1cm mỗi bên) để ô UPS giãn rộng thêm; +63px do cột KPI rộng thêm 1/3. */
  .wrap { max-width: 1443px; margin: 0 auto; }

  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .topbar img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; }
  .topbar h1 { font-size: 20px; margin: 0; }
  .topbar .title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sync-btn { flex: none; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--card-border);
    background: var(--card); color: var(--text); cursor: pointer; font-size: 18px; line-height: 1; display: inline-flex;
    align-items: center; justify-content: center; transition: border-color .2s, color .2s; }
  .sync-btn:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
  .sync-btn:disabled { cursor: progress; opacity: .8; }
  .sync-btn.spin .ico { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sync-msg { font-size: 12px; margin-top: 4px; min-height: 16px; color: var(--text-dim); }
  .sync-msg.ok { color: var(--green); }
  .sync-msg.err { color: var(--red); }
  .topbar .sub { color: var(--text-dim); font-size: 13px; margin-top: 2px; }

  .kpi-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .kpi {
    background: linear-gradient(135deg, #182238, #101729);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px 18px;
    position: relative;
    overflow: hidden;
  }
  .kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent, var(--green)); }
  .kpi .label { color: var(--text-dim); font-size: 12.5px; font-weight: 500; }
  .kpi .value { font-size: 28px; font-weight: 800; margin-top: 6px; }
  .kpi-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--card-border); }
  .kpi-row:first-of-type { margin-top: 8px; }
  .kpi-row .period { color: var(--text-dim); font-size: 12.5px; font-weight: 500; }
  .kpi-row .v-energy, .kpi-row .v-money { text-align: right; }
  .kpi-row .v-energy { font-size: 28px; font-weight: 800; margin-top: 4px; }
  .kpi-row .v-money { font-size: 28px; font-weight: 800; color: var(--green); margin-top: 2px; }
  .kpi-row .unit { font-size: 14px; margin-left: 4px; }
  .kpi .unit { font-size: 14px; color: var(--text-dim); font-weight: 600; margin-left: 4px; }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; }
  .badge.online { background: rgba(34,197,94,.12); color: var(--green); }
  .badge.online .dot { background: var(--green); animation: pulse 2s infinite; }
  .badge.offline { background: rgba(239,68,68,.12); color: var(--red); }
  .badge.offline .dot { background: var(--red); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.5); } 70% { box-shadow: 0 0 0 6px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }

  /* Cột 4 ô KPI hẹp lại còn ~2/3 bề rộng gốc (trước đây nằm hàng ngang phía
     trên, mỗi ô ~260-280px), đặt bên trái ô UPS thay vì phía trên. */
  .top-row { display: grid; grid-template-columns: minmax(200px, 253px) 1fr; gap: 14px; align-items: start; }
  @media (max-width: 900px) {
    .top-row { grid-template-columns: 1fr; }
    .kpi-grid { flex-direction: row; flex-wrap: wrap; }
    .kpi-grid .kpi { flex: 1 1 180px; }
    .kpi-grid .topbar { flex: 1 1 100%; }
  }

  /* --- Sơ đồ UPS đầy đủ ngay trên trang tổng quan (không cần vào trang
     chi tiết): Input - Rectifier - Inverter - Output + nhánh Battery + 4
     khung thông tin, giống bố cục phần mềm ViewPower gốc. --- */
  .ups-section {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px 18px;
    height: 100%;
  }
  .ups-section .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 14px; }
  .ups-section .name { font-weight: 700; font-size: 15px; }
  .ups-section .id { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
  .ups-section.offline { opacity: .55; }

  .ups-diagram {
    background: var(--bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 20px 16px;
    margin-bottom: 16px;
  }

  /* Sơ đồ dùng đúng ảnh nền + overlay GIF gốc của ViewPower (statusbg.png +
     input/output/bypass/upVline/downVline.gif), định vị theo % để co giãn
     theo chiều rộng thay vì px cố định. Toạ độ gốc (canvas 541x344px):
     input(0,139,251x17) output(290,139,251x17) bypass(150,18,241x17)
     upVline(130,36,17x100) bypassdownVline(394,37,17x100) downVline(262,158,17x100) */
  .ups-diagram-img { position: relative; width: 100%; max-width: 541px; aspect-ratio: 541 / 344; margin: 0 auto; }
  .ups-diagram-img img { position: absolute; display: none; }
  .ups-diagram-img img.bg { display: block; top: 0; left: 0; width: 100%; height: 100%; }
  .ups-diagram-img img.show { display: block; }
  .ups-diagram-img .ov-input { top: 40.41%; left: 0%; width: 46.39%; height: 4.94%; }
  .ups-diagram-img .ov-output { top: 40.41%; left: 53.60%; width: 46.39%; height: 4.94%; }
  .ups-diagram-img .ov-output-bypass { top: 40.41%; left: 76.52%; width: 23.48%; height: 4.94%; }
  .ups-diagram-img .ov-bypass { top: 5.23%; left: 27.73%; width: 44.55%; height: 4.94%; }
  .ups-diagram-img .ov-bypass-left { top: 10.47%; left: 24.03%; width: 3.14%; height: 29.07%; }
  .ups-diagram-img .ov-bypass-right { top: 10.76%; left: 72.83%; width: 3.14%; height: 29.07%; }
  .ups-diagram-img .ov-battery-charge, .ups-diagram-img .ov-battery-discharge {
    top: 45.93%; left: 48.43%; width: 3.14%; height: 29.07%;
  }

  /* Ô tròn "Solar" (không có sẵn trong statusbg.png gốc) + đường dây ngang
     màu trắng nối sang Battery — cùng kích thước/tâm trục với circle Input
     (đo bằng flood-fill theo màu nền circle), chỉ đổi tầng y sang hàng
     Battery để có thể nối thẳng 1 đường ngang. */
  .ups-diagram-img .ov-solar-line, .ups-diagram-img .ov-solar-anim {
    top: 81.98%; left: 19.04%; width: 24.58%; height: 4.94%;
  }
  .ups-diagram-img .ov-solar-line {
    position: absolute; background: #fff; border-radius: 2px;
  }
  .ups-diagram-img .solar-circle {
    position: absolute; top: 74.71%; left: 6.65%; width: 12.38%; height: 19.48%;
    border-radius: 50%; background: #b5aecd; display: flex; align-items: center; justify-content: center;
  }
  .ups-diagram-img .solar-circle svg { width: 55%; height: 55%; }

  /* Che chữ đen "Bypass/Input/Output/Battery" vốn nằm sẵn trong statusbg.png
     bằng nhãn màu xanh lá (toạ độ đo trực tiếp từ ảnh gốc bằng phân tích
     pixel, không phải áng chừng). */
  .ups-diagram-img .label-patch {
    position: absolute; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--green); font-weight: 700; font-size: 18px;
    white-space: nowrap; overflow: visible;
  }
  /* Input/Output circle kết thúc ở y=176px (51.16%), Battery circle kết
     thúc ở y=321px (93.3%) -> khung chữ phải bắt đầu SAU 2 mốc này để
     không đè lên icon. */
  .ups-diagram-img .lbl-bypass { top: 0%; left: 42%; width: 16%; height: 4.5%; }
  .ups-diagram-img .lbl-input { top: 51.3%; left: 7.5%; width: 11%; height: 6.5%; }
  .ups-diagram-img .lbl-output { top: 51.3%; left: 80.5%; width: 13%; height: 6.5%; }
  .ups-diagram-img .lbl-battery { top: 93.5%; left: 43%; width: 14%; height: 6.5%; }
  .ups-diagram-img .lbl-solar { top: 94.3%; left: 7.5%; width: 11%; height: 6.5%; }

  /* Bố cục 4 khung thông tin nằm CẠNH sơ đồ (không xếp bên dưới nữa), giống
     bố cục gốc ViewPower: UPS trên-phải, Input trái-giữa, Output phải-giữa,
     Battery dưới-giữa. Thu về 1 cột trên màn hình hẹp. */
  .ups-layout {
    display: grid;
    grid-template-columns: minmax(150px, 1fr) minmax(260px, 2fr) minmax(150px, 1fr);
    grid-template-areas:
      "input  diagram ups"
      "solar  diagram output"
      ".      battery .";
    gap: 14px;
    align-items: center;
  }
  .ups-layout .area-diagram { grid-area: diagram; }
  .ups-layout .area-ups { grid-area: ups; }
  /* Đẩy ô Input xuống ~56px để mép dưới ô ngang với mép dưới biểu tượng Input. */
  .ups-layout .area-input { grid-area: input; position: relative; top: 56px; }
  /* Đẩy ô Solar xuống ~49px (position relative không đổi layout lưới) để
     tâm ô khớp với tâm biểu tượng Solar trong sơ đồ (84.45% chiều cao sơ đồ). */
  .ups-layout .area-solar { grid-area: solar; position: relative; top: 49px; }
  .ups-layout .area-output { grid-area: output; }
  .ups-layout .area-battery { grid-area: battery; }
  @media (max-width: 720px) {
    .ups-layout {
      grid-template-columns: 1fr;
      grid-template-areas: "diagram" "input" "ups" "solar" "output" "battery";
    }
    .ups-layout .area-solar, .ups-layout .area-input { top: 0; }
  }

  /* Solar/Battery information: dữ liệu sạc lấy từ MPPT Charger (chung 1 bộ
     ắc quy với UPS) — tựa đề chuyển xanh khi đang có dòng sạc ắc quy
     (batCurrent > 0), tắt về màu mặc định (giống Input) khi không sạc. */
  .info-panel .info-title { transition: color .2s; }
  .info-panel.active .info-title { color: var(--green); }
  .info-value.charging { color: var(--green); }
  /* Battery information hẹp lại còn 2/3 chiều rộng gốc (cột diagram), canh giữa. */
  .ups-layout .area-battery.battery-panel { width: 66.67%; margin: 0 auto; }

  .info-panel { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 14px 16px; }
  .info-panel .info-title {
    font-weight: 700; font-size: 13px; text-align: center; padding-bottom: 8px; margin-bottom: 8px;
    border-bottom: 1px solid var(--card-border); color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em;
  }
  .info-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 5px 0; }
  .info-row .info-label { color: var(--text-dim); font-size: 13.5px; }
  .info-row .info-value { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .info-row .info-value .unit { color: var(--text-dim); font-weight: 500; font-size: 13px; margin-left: 3px; }

  .empty { color: var(--text-dim); text-align: center; margin-top: 60px; }
  .empty code { background: var(--card); padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
  <div class="wrap">
    <div id="content" style="display:none">
      <div class="top-row" id="topRow">
        <div class="kpi-grid">
          <div class="topbar">
            <div>
              <div class="title-row">
                <h1>Tổng quan hệ thống</h1>
                <button class="sync-btn" id="syncBtn" type="button" title="Đồng bộ và cập nhật số liệu mới nhất từ cloud và Google Drive" aria-label="Đồng bộ"><span class="ico">⟳</span></button>
              </div>
              <div class="sub" id="subLine">Đang tải…</div>
              <div class="sync-msg" id="syncMsg"></div>
            </div>
          </div>
          <div class="kpi" style="--accent:var(--amber)">
            <div class="label">Tổng công suất hiện tại</div>
            <div class="value" style="text-align:right"><span id="kpiPower">--</span><span class="unit">W</span></div>
          </div>
          <div class="kpi" style="--accent:var(--green)">
            <div class="label" id="kpiEnergyLabel">Điện năng / Tiết kiệm</div>
            <div class="kpi-row">
              <div class="period">Hôm nay</div>
              <div class="v-energy"><span id="kpiToday">--</span><span class="unit">kWh</span></div>
              <div class="v-money"><span id="kpiSavingToday">--</span><span class="unit">VND</span></div>
            </div>
            <div class="kpi-row">
              <div class="period">Tháng này</div>
              <div class="v-energy"><span id="kpiMonth">--</span><span class="unit">kWh</span></div>
              <div class="v-money"><span id="kpiSavingMonth">--</span><span class="unit">VND</span></div>
            </div>
            <div class="kpi-row">
              <div class="period">Năm nay</div>
              <div class="v-energy"><span id="kpiYear">--</span><span class="unit">kWh</span></div>
              <div class="v-money"><span id="kpiSavingYear">--</span><span class="unit">VND</span></div>
            </div>
            <div class="kpi-row">
              <div class="period">Tích luỹ</div>
              <div class="v-energy"><span id="kpiTotal">--</span><span class="unit">kWh</span></div>
              <div class="v-money"><span id="kpiSaving">--</span><span class="unit">VND</span></div>
            </div>
          </div>
        </div>
        <div id="upsSection"></div>
      </div>
    </div>

    <div class="empty" id="emptyState" style="display:none">
      <p style="font-size:16px">Chưa có thiết bị nào được ghi nhận.</p>
      <p style="font-size:13px">Chạy <code>./scan.sh</code> để dò thiết bị trong mạng nội bộ, hoặc khai báo tay trong <code>config.toml</code>.</p>
    </div>
  </div>

<script>
const POLL_MS = 2000;

// Đơn giá điện dùng để quy đổi điện năng tích luỹ thành tiền tiết kiệm (VND/kWh).
const PRICE_PER_KWH_VND = 2998;

function fmt(v, decimals) {
  if (v === null || v === undefined || Number.isNaN(v)) return "--";
  return Number(v).toFixed(decimals);
}

// Diễn giải statusText thô từ thiết bị sang nhãn dễ hiểu hơn. Chỉ suy diễn
// khi có dữ liệu thực tế xác nhận (vd: PV thấp hơn Battery -> chắc chắn
// không thể sạc), tránh gán cứng 1 lời giải thích có thể sai cho mọi
// trường hợp UNKNOWN.
function friendlyStatus(kind, raw, payload) {
  if (kind === "Charger" && raw === "UNKNOWN") {
    const pv = payload.pvVoltage, bat = payload.batVoltage;
    if (pv !== undefined && bat !== undefined && pv < bat && (payload.chargingPower || 0) < 1) {
      return "Dừng sạc (áp PV thấp)";
    }
    return "Không xác định";
  }
  if (kind === "Ups") return friendlyUpsStatus(raw);
  if (raw === "Charging") return "Đang sạc";
  if (raw === "Idle") return "Chờ";
  return raw;
}

// ViewPower trả workMode dạng chữ sẵn (vd: "ECO mode"), chỉ cần hiện nguyên văn.
function friendlyUpsStatus(raw) {
  if (!raw) return "Không rõ";
  return raw;
}

function extractMetrics(data) {
  if (!data) return null;
  if (data.charger) {
    return {
      kind: "Charger",
      power: data.charger.chargingPower,
      // Điện năng thực vào ắc quy (service tự tích phân V×I); bộ đếm của
      // thiết bị (powerToday/powerTotal) tính theo PV nên cao hơn ~9%.
      today: data.charger.batToday,
      month: data.charger.batMonth,
      year: data.charger.batYear,
      total: data.charger.batTotal,
      batVoltage: data.charger.batVoltage,
      batCurrent: data.charger.batCurrent,
      temp: data.charger.temperature,
      status: friendlyStatus("Charger", data.charger.statusText, data.charger),
    };
  }
  if (data.inverter) {
    return {
      kind: "Inverter",
      power: data.inverter.outputPower,
      today: data.inverter.energyToday,
      total: data.inverter.energyTotal,
      temp: data.inverter.temperature,
      status: data.inverter.statusText,
    };
  }
  if (data.ups) {
    return {
      kind: "Ups",
      // Không phải năng lượng mặt trời -> không cộng vào tổng công suất/điện năng hệ thống.
      power: null,
      today: null,
      total: null,
      temp: data.ups.temperature,
      status: friendlyStatus("Ups", data.ups.statusText, data.ups),
      bypassActive: !!data.ups.bypassActive,
      onBattery: !!data.ups.onBattery,
      load: data.ups.load,
      batteryCharge: data.ups.batteryCharge,
      batteryRuntimeMin: data.ups.batteryRuntimeMin,
    };
  }
  return null;
}

// Sơ đồ UPS đầy đủ (giống hệt bố cục ViewPower gốc), hiển thị trực tiếp
// trên trang tổng quan — không cần vào trang chi tiết.
function renderUpsSection(device, liveData, chargerLiveData) {
  const online = !!(liveData && liveData.hasData && liveData.ups);
  const name = (liveData && liveData._name) || device.device_id;
  const payload = online ? liveData.ups : {};
  const statusLabel = online ? friendlyStatus("Ups", payload.statusText, payload) : "Mất kết nối";
  const bypass = !!payload.bypassActive;
  const onBattery = !!payload.onBattery;
  // Dữ liệu sạc pin từ MPPT Charger (thiết bị khác) — chỉ dùng cho ô "Solar
  // information", vì UPS và Charger dùng chung 1 bộ ắc quy.
  const solar = (chargerLiveData && chargerLiveData.hasData && chargerLiveData.charger) || null;
  const solarCharging = !!(solar && solar.batCurrent > 0);
  const outputActive = (payload.load || 0) > 0;

  // Dòng xả ắc quy (khi là số ước tính P/(hiệu suất×V)) chỉ phản ánh dòng
  // inverter rút ra — nếu solar đang đồng thời sạc vào cùng bộ ắc quy đó,
  // phần dòng xả thực (net) giảm đi đúng bằng dòng sạc solar (KCL tại cực
  // ắc quy); dòng đo trực tiếp thật (không estimated) đã tự là dòng net rồi
  // nên không cộng/trừ gì thêm.
  let dischargeCurrent = payload.dischargeCurrent;
  if (payload.dischargeCurrentEstimated && dischargeCurrent != null && solarCharging) {
    dischargeCurrent = Math.max(0, dischargeCurrent - solar.batCurrent);
  }

  return `
    <div class="ups-section ${online ? "" : "offline"}">
      <div class="head">
        <div>
          <div class="name">${name}</div>
          <div class="id">${device.device_id} · UPS</div>
        </div>
        <span class="badge ${online ? "online" : "offline"}"><span class="dot"></span>${statusLabel}</span>
      </div>

      <div class="ups-diagram">
        <div class="ups-layout">
          <div class="area-diagram">
            <div class="ups-diagram-img">
              <img class="bg" src="/static/ups/${online ? "statusbg.png" : "statusbg_offline.png"}">
              <!-- Bộ sạc (Rectifier) chạy độc lập với đường Bypass: hễ có điện lưới
                   (không xả ắc quy) là còn sạc AC -> Battery, kể cả khi bypass đang
                   bật (bypass chỉ thay đường ra Output, không tắt bộ sạc). -->
              <img class="ov-input ${online && !onBattery ? "show" : ""}" src="/static/ups/input.gif">
              <!-- Đường ra Output: bypass bật -> đi thẳng (đoạn ngắn outputbypass,
                   không qua Inverter); bypass tắt -> qua Inverter (đoạn đầy đủ). -->
              <img class="ov-output ${online && !bypass ? "show" : ""}" src="/static/ups/output.gif">
              <img class="ov-output-bypass ${bypass ? "show" : ""}" src="/static/ups/outputbypass.gif">
              <img class="ov-bypass ${bypass ? "show" : ""}" src="/static/ups/bypass.gif">
              <img class="ov-bypass-left ${bypass ? "show" : ""}" src="/static/ups/upVline.gif">
              <img class="ov-bypass-right ${bypass ? "show" : ""}" src="/static/ups/bypassdownVline.gif">
              <!-- Có input (không xả ắc quy) -> luôn có nhánh sạc ắc quy (chiều xuống);
                   đang xả (mất điện lưới) -> đổi sang chiều lên (upVline.gif dùng lại). -->
              <img class="ov-battery-charge ${online && !onBattery ? "show" : ""}" src="/static/ups/downVline.gif">
              <img class="ov-battery-discharge ${onBattery ? "show" : ""}" src="/static/ups/upVline.gif">
              <div class="ov-solar-line"></div>
              <!-- Dùng lại đúng downVline.gif (xoay ngang 90°) thay vì tự vẽ animation
                   bằng CSS — giữ nguyên hiệu ứng "vệt sáng chạy" gốc của ViewPower,
                   chiều chạy trái->phải (Solar->Battery) khớp chiều sạc. -->
              <img class="ov-solar-anim ${solarCharging ? "show" : ""}" src="/static/ups/solarline.gif">
              <div class="solar-circle">
                <svg viewBox="0 0 24 24" fill="none" stroke="#231815" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
              </div>
              <div class="label-patch lbl-bypass">Bypass</div>
              <div class="label-patch lbl-input">Input</div>
              <div class="label-patch lbl-output">Output</div>
              <div class="label-patch lbl-battery">Battery</div>
              <div class="label-patch lbl-solar">Solar</div>
            </div>
          </div>

          <div class="area-input info-panel">
            <div class="info-title">Input information</div>
            <div class="info-row"><span class="info-label">Input voltage</span><span class="info-value">${fmt(payload.inputVoltage, 1)}<span class="unit">V</span></span></div>
            <div class="info-row"><span class="info-label">Input frequency</span><span class="info-value">${fmt(payload.inputFrequency, 1)}<span class="unit">Hz</span></span></div>
          </div>
          <div class="area-ups info-panel ${online ? "active" : ""}">
            <div class="info-title">UPS information</div>
            <div class="info-row"><span class="info-label">UPS mode</span><span class="info-value">${payload.workMode || "--"}</span></div>
            <div class="info-row"><span class="info-label">UPS temp.</span><span class="info-value">${fmt(payload.temperature, 1)}<span class="unit">°C</span></span></div>
          </div>
          <div class="area-solar info-panel ${solarCharging ? "active" : ""}">
            <div class="info-title">Solar information</div>
            <div class="info-row"><span class="info-label">PV voltage</span><span class="info-value">${fmt(solar?.pvVoltage, 1)}<span class="unit">V</span></span></div>
            <div class="info-row"><span class="info-label">PV current</span><span class="info-value">${fmt(solar?.pvCurrent, 2)}<span class="unit">A</span></span></div>
            <div class="info-row"><span class="info-label">Charging voltage</span><span class="info-value">${fmt(solar?.batVoltage, 1)}<span class="unit">V</span></span></div>
            <div class="info-row"><span class="info-label">Charging current</span><span class="info-value ${solarCharging ? "charging" : ""}">${fmt(solar?.batCurrent, 2)}<span class="unit">A</span></span></div>
            <div class="info-row"><span class="info-label">Charging power</span><span class="info-value ${solarCharging ? "charging" : ""}">${fmt(solar ? solar.batVoltage * solar.batCurrent : null, 0)}<span class="unit">W</span></span></div>
          </div>
          <div class="area-output info-panel ${outputActive ? "active" : ""}">
            <div class="info-title">Output information</div>
            <div class="info-row"><span class="info-label">Output voltage</span><span class="info-value">${fmt(payload.outputVoltage, 1)}<span class="unit">V</span></span></div>
            <div class="info-row"><span class="info-label">Output frequency</span><span class="info-value">${fmt(payload.outputFrequency, 1)}<span class="unit">Hz</span></span></div>
            <div class="info-row"><span class="info-label">Load level</span><span class="info-value">${fmt(payload.load, 0)}<span class="unit">%</span></span></div>
            <div class="info-row"><span class="info-label">Power consumption</span><span class="info-value">${fmt(payload.loadWatts, 0)}<span class="unit">W</span></span></div>
            <div class="info-row"><span class="info-label">Current</span><span class="info-value">${fmt(payload.outputCurrent, 1)}<span class="unit">A</span></span></div>
          </div>
          <div class="area-battery info-panel battery-panel ${solarCharging ? "active" : ""}">
            <div class="info-title">Battery information</div>
            <div class="info-row"><span class="info-label">Battery voltage</span><span class="info-value">${fmt(payload.batteryVoltage, 1)}<span class="unit">V</span></span></div>
            <div class="info-row"><span class="info-label">Discharge current${payload.dischargeCurrentEstimated ? " (estimated)" : ""}</span><span class="info-value ${solarCharging ? "charging" : ""}">${payload.dischargeCurrentEstimated ? "≈" : ""}${fmt(dischargeCurrent, 1)}<span class="unit">A</span></span></div>
            <div class="info-row"><span class="info-label">Battery capacity</span><span class="info-value">${fmt(payload.batteryCharge, 0)}<span class="unit">%</span></span></div>
            <div class="info-row"><span class="info-label">Remaining backup time</span><span class="info-value">${fmt(payload.batteryRuntimeMin, 0)}<span class="unit">Min</span></span></div>
          </div>
        </div>
      </div>
    </div>
  `;
}

async function tick() {
  const [devicesRes, statusRes] = await Promise.all([
    fetch("/api/devices"),
    fetch("/api/status"),
  ]);
  const devices = await devicesRes.json();
  const statusMap = await statusRes.json();

  // Sắp theo tên hiển thị, ổn định qua từng lần refresh — không sắp theo
  // last_seen (API trả mặc định) vì sẽ làm thiết bị nhảy vị trí liên tục
  // mỗi khi có dữ liệu mới.
  devices.sort((a, b) => {
    const nameA = (statusMap[a.device_id] && statusMap[a.device_id]._name) || a.device_id;
    const nameB = (statusMap[b.device_id] && statusMap[b.device_id]._name) || b.device_id;
    return nameA.localeCompare(nameB, "vi");
  });

  if (!devices.length) {
    document.getElementById("content").style.display = "none";
    document.getElementById("emptyState").style.display = "block";
    document.getElementById("subLine").textContent = "Chưa có thiết bị";
    return;
  }

  document.getElementById("content").style.display = "block";
  document.getElementById("emptyState").style.display = "none";

  let totalPower = 0, totalToday = 0, totalMonth = 0, totalYear = 0, totalTotal = 0, onlineCount = 0, offlineEnergy = false;
  for (const device of devices) {
    const liveData = statusMap[device.device_id];
    const metrics = extractMetrics(liveData);
    if (liveData && liveData.hasData && metrics) {
      onlineCount++;
      totalPower += metrics.power || 0;
      totalToday += metrics.today || 0;
      totalMonth += metrics.month || 0;
      totalYear += metrics.year || 0;
      totalTotal += metrics.total || 0;
    } else if (liveData && liveData._offline && metrics) {
      // Thiết bị mất kết nối: vẫn cộng số điện năng ĐÃ LƯU (không có công suất tức thời).
      offlineEnergy = true;
      totalToday += metrics.today || 0;
      totalMonth += metrics.month || 0;
      totalYear += metrics.year || 0;
      totalTotal += metrics.total || 0;
    }
  }
  document.getElementById("kpiEnergyLabel").textContent =
    offlineEnergy ? "Điện năng / Tiết kiệm · số đã lưu (MPPT mất kết nối)" : "Điện năng / Tiết kiệm";

  document.getElementById("kpiPower").textContent = fmt(totalPower, 0);
  document.getElementById("kpiToday").textContent = fmt(totalToday, 3);
  document.getElementById("kpiMonth").textContent = fmt(totalMonth, 3);
  document.getElementById("kpiSavingMonth").textContent = Math.round(totalMonth * PRICE_PER_KWH_VND).toLocaleString("vi-VN");
  document.getElementById("kpiYear").textContent = fmt(totalYear, 3);
  document.getElementById("kpiSavingYear").textContent = Math.round(totalYear * PRICE_PER_KWH_VND).toLocaleString("vi-VN");
  document.getElementById("kpiTotal").textContent = fmt(totalTotal, 3);
  document.getElementById("kpiSavingToday").textContent = Math.round(totalToday * PRICE_PER_KWH_VND).toLocaleString("vi-VN");
  document.getElementById("kpiSaving").textContent = Math.round(totalTotal * PRICE_PER_KWH_VND).toLocaleString("vi-VN");
  const viaCloud = Object.values(statusMap).some(v => v.charger && v.hasData && v._source === "cloud");
  document.getElementById("subLine").textContent =
    `${devices.length} thiết bị đã ghi nhận · ${onlineCount} đang online` + (viaCloud ? " · MPPT qua cloud" : "");

  const isUps = (d) => d.device_type === "UPS" || !!(statusMap[d.device_id] && statusMap[d.device_id].ups);
  const isCharger = (d) => !!(statusMap[d.device_id] && statusMap[d.device_id].charger);
  const upsDevices = devices.filter(isUps);
  const chargerDevices = devices.filter(isCharger);
  const mpptDevice = chargerDevices[0]; // dùng để lấy dữ liệu sạc cho ô "Solar information" của UPS

  document.getElementById("upsSection").innerHTML =
    upsDevices.map(d => renderUpsSection(d, statusMap[d.device_id], mpptDevice ? statusMap[mpptDevice.device_id] : null)).join("");

  document.getElementById("upsSection").style.display = upsDevices.length ? "block" : "none";
}

// Nút đồng bộ: kéo số liệu mới nhất từ cloud + bản sao Google Drive rồi làm mới trang.
(function () {
  const btn = document.getElementById("syncBtn"), msg = document.getElementById("syncMsg");
  const hhmm = (t) => new Date(t * 1000).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
  const show = (text, cls) => { msg.textContent = text; msg.className = "sync-msg " + (cls || ""); };
  btn.addEventListener("click", async () => {
    btn.disabled = true; btn.classList.add("spin"); show("Đang đồng bộ…");
    try {
      const res = await fetch("/api/sync", { method: "POST" });
      const r = await res.json();
      const errs = Object.entries(r.errors || {});
      if (errs.length) {
        const names = { cloud: "Cloud", drive: "Google Drive", config: "Cấu hình", busy: "Bận" };
        show(errs.map(([k, v]) => `${names[k] || k}: ${v}`).join(" · "), "err");
      } else {
        const parts = [];
        if (r.cloud) parts.push("Cloud ✓");
        if (r.drive) parts.push(`Drive ✓${r.drive.filled ? ` (vá ${r.drive.filled} giờ)` : ""}`);
        const filled = (r.cloud && r.cloud.filled) || 0;
        if (filled) parts.push(`vá ${filled} giờ từ cloud`);
        show(`Đã đồng bộ lúc ${hhmm(r.at)} · ${parts.join(" · ")}`, "ok");
      }
      await tick();
    } catch (e) {
      show("Lỗi kết nối: " + e.message, "err");
    } finally {
      btn.disabled = false; btn.classList.remove("spin");
    }
  });
  fetch("/api/sync").then(r => r.json()).then(r => { if (r && r.at) show(`Đồng bộ lần cuối ${hhmm(r.at)}`, r.ok ? "ok" : "err"); }).catch(() => {});
})();

tick();
setInterval(tick, POLL_MS);
</script>
